<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel do Professor - MVP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3">Turma - Dispositivos</h1>
    <button class="btn btn-primary" onclick="refreshDevices()">Atualizar</button>
  </div>
  <div class="mb-3">
    <button class="btn btn-warning" onclick="applyBlock()">Bloquear HTTP/HTTPS (selecionados)</button>
    <button class="btn btn-success" onclick="applyOpen()">Liberar internet (selecionados)</button>
  </div>
  <div id="devices-grid" class="row g-3"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
